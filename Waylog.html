<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Waylog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#FFF0C5;color:#2D2442;font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#287F80}a:hover{color:#2D2442}
[hidden]{display:none!important}

/* ---------- 첫 페이지 (반응형) ---------- */
#landing{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:
    radial-gradient(circle at 12% 18%, rgba(138,214,209,.45) 0 120px, transparent 121px),
    radial-gradient(circle at 92% 82%, rgba(255,140,82,.22) 0 160px, transparent 161px),
    #FFF0C5}
.lp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px clamp(16px,5vw,64px)}
.lp-brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700;letter-spacing:-.8px}
.lp-tag{font-size:13px;font-weight:700;padding:6px 12px;border:2px solid #2D2442;border-radius:999px;background:#FFFFFF;white-space:nowrap}
.lp-main{flex:1;justify-content:center;width:100%;max-width:1120px;margin:0 auto;padding:clamp(8px,3vh,32px) clamp(16px,5vw,64px) clamp(32px,8vh,96px);display:flex;flex-direction:column;gap:clamp(24px,5vh,48px)}
.lp-hero h1{margin:0;text-align:center;font-size:clamp(26px,4vw,44px);line-height:1.18;letter-spacing:-1.6px;font-weight:700;text-wrap:balance}
.lp-hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,#8AD6D1 62%)}
.lp-hero p{margin:14px 0 0;font-size:clamp(15px,1.8vw,18px);line-height:1.6;color:#4F4766;max-width:620px}
.lp-choose{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2.4vw,28px)}
.lp-card{position:relative;display:flex;flex-direction:column;gap:18px;padding:clamp(18px,2.6vw,28px);text-decoration:none;color:#2D2442;background:#FFFFFF;border:2.5px solid #2D2442;border-radius:22px;box-shadow:0 6px 0 #2D2442;transition:transform .12s,box-shadow .12s,background .12s}
.lp-card:hover{color:#2D2442;transform:translateY(-3px);box-shadow:0 9px 0 #2D2442;background:#FFFCF2}
.lp-card:active{transform:translateY(4px);box-shadow:0 2px 0 #2D2442}
.lp-card:focus-visible{outline:4px solid #359FA0;outline-offset:4px}
.lp-art{height:clamp(150px,22vw,220px);border-radius:16px;background:#FFF7DE;border:2px solid #2D2442;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.lp-art.mobile{background:#E3F5F3}
.dev-phone{width:clamp(88px,11vw,118px);aspect-ratio:9/17;margin-bottom:-14%;border:3px solid #2D2442;border-radius:20px;background:#FFFFFF;padding:10px 7px;display:flex;flex-direction:column;gap:6px;box-shadow:6px 6px 0 rgba(45,36,66,.15)}
.dev-pc{width:clamp(170px,24vw,250px);aspect-ratio:16/10;margin-bottom:-6%;border:3px solid #2D2442;border-bottom-width:12px;border-radius:12px 12px 4px 4px;background:#FFFFFF;display:grid;grid-template-columns:34% 1fr;gap:6px;padding:7px;box-shadow:6px 6px 0 rgba(45,36,66,.15)}
.dev-map{flex:1;border-radius:8px;background:#FFF0C5;display:flex;align-items:center;justify-content:center;overflow:hidden}
.dev-map svg{width:100%;height:auto}
.dev-bar{height:7px;border-radius:4px;background:#8AD6D1}
.dev-bar.s{width:60%;background:#2D2442;opacity:.18}
.dev-side{display:flex;flex-direction:column;gap:5px;padding-top:2px}
.lp-row{display:flex;align-items:center;min-height:48px;justify-content:space-between;gap:12px}
.lp-name{font-size:clamp(20px,2.4vw,26px);font-weight:700;letter-spacing:-.6px}
.lp-desc{margin:4px 0 0;font-size:14px;line-height:1.55;color:#4F4766}
.lp-go{flex-shrink:0;width:48px;height:48px;border-radius:14px;border:2px solid #2D2442;background:#8AD6D1;display:flex;align-items:center;justify-content:center}
.lp-card.pc .lp-go{background:#FF8C52}
.lp-rec{position:absolute;top:-14px;left:20px;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:#2D2442;color:#FFF0C5;border:2px solid #2D2442}
.lp-feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0;padding:0;list-style:none}
.lp-feat li{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:14px;background:rgba(255,255,255,.6);border:2px dashed rgba(45,36,66,.35);font-size:14px;line-height:1.5}
.lp-feat b{display:block;font-size:15px}
.lp-feat i{flex-shrink:0;width:28px;height:28px;border-radius:8px;border:2px solid #2D2442;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:13px}
.lp-foot{padding:18px clamp(16px,5vw,64px) 24px;font-size:13px;color:#4F4766;text-align:center}
@media (max-width:760px){
  .lp-choose{grid-template-columns:1fr;gap:26px}
  .lp-feat{grid-template-columns:1fr}
  .lp-art{height:150px}
  .lp-card.mobile{order:-1}
  body.prefer-pc .lp-card.mobile{order:0}
}

/* ---------- 프로토타입 뷰 ---------- */
#viewer{position:fixed;inset:0;background:#2D2442;display:flex;flex-direction:column}
.vw-bar{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;color:#FFF0C5}
.vw-back{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 8px;border-radius:10px;border:2px solid rgba(255,240,197,.5);background:transparent;color:#FFF0C5;font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.vw-back:hover{border-color:#FFF0C5;color:#FFF0C5;background:rgba(255,240,197,.08)}
.vw-seg{display:flex;border:2px solid #FFF0C5;border-radius:10px;overflow:hidden}
.vw-seg a{height:32px;padding:0 14px;display:flex;align-items:center;font-size:13px;font-weight:700;color:#FFF0C5;text-decoration:none}
.vw-seg a[aria-current="page"]{background:#FFF0C5;color:#2D2442}
.vw-title{font-size:14px;font-weight:700;opacity:.85;white-space:nowrap}
.vw-stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-bottom:8px}
#stage{position:relative;overflow:clip;box-shadow:0 20px 60px rgba(0,0,0,.35);background:#FFF0C5}
#app{position:absolute;left:0;top:0;transform-origin:0 0}
@media (max-width:500px){.vw-title{display:none}.vw-stagewrap{padding-bottom:0}#stage{border-radius:0!important;box-shadow:none}}



.wl button,.wl input,.wl select,.wl textarea{font-family:inherit;color:#2D2442}
.wl button{cursor:pointer}
.wl .btn{width:100%;height:52px;border-radius:14px;border:2px solid #2D2442;background:#8AD6D1;font-size:16px;font-weight:700;box-shadow:0 4px 0 #2D2442;transition:transform .08s,box-shadow .08s}
.wl .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2D2442}
.wl .btn.ghost{background:#FFFFFF}
.wl .btn.orange{background:#FF8C52}
.wl .field{width:100%;box-sizing:border-box;height:48px;border-radius:12px;border:2px solid #2D2442;background:#FFFFFF;padding:0 14px;font-size:15px}
.wl .field:focus{outline:3px solid #8AD6D1;outline-offset:1px}
.wl .lbl{font-size:13px;font-weight:700;margin-bottom:6px;display:block}
.wl .chip{height:38px;padding:0 12px;border-radius:999px;border:2px solid #2D2442;background:#FFFFFF;font-size:13px;font-weight:700}
.wl .card{background:#FFFFFF;border:2px solid #2D2442;border-radius:14px}
.wl .icon{width:44px;height:44px;border-radius:12px;border:2px solid #2D2442;background:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.wl .step{width:34px;height:34px;border-radius:9px;border:2px solid #2D2442;background:#FFFFFF;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.wl .mini{width:34px;height:34px;border-radius:9px;border:none;background:#FFF7DE;display:flex;align-items:center;justify-content:center;padding:0}
.wl .stay-range{-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;background:linear-gradient(90deg,#8AD6D1,#359FA0);border:2px solid #2D2442;outline:none;margin:10px 0}
.wl .stay-range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#FF8C52;border:2.5px solid #2D2442;cursor:pointer}
.wl .stay-range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#FF8C52;border:2.5px solid #2D2442;cursor:pointer}
.wl .stay-range:focus-visible{box-shadow:0 0 0 3px #8AD6D1}
.wl .ph-add:focus-within{outline:3px solid #359FA0;outline-offset:2px}
.wl .ph-add:hover{background:#FFF7DE}
.wl .scroll>*{flex-shrink:0}
.wl .scroll{overflow-y:auto;scrollbar-width:none}
.wl .scroll::-webkit-scrollbar{display:none}
@keyframes wldrawA{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes wldrawB{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes wlmoveA{from{transform:translate(var(--dx),var(--dy))}to{transform:translate(0,0)}}
@keyframes wlmoveB{from{transform:translate(var(--dx),var(--dy))}to{transform:translate(0,0)}}
@keyframes wlblink{0%,100%{opacity:1;filter:brightness(1)}50%{opacity:.35;filter:brightness(1.35)}}
@keyframes wlglow{0%,100%{box-shadow:0 0 0 3px #FFFFFF,0 0 0 6px #FF8C52;filter:brightness(1)}50%{box-shadow:0 0 0 6px #FFFFFF,0 0 0 14px rgba(255,140,82,.25);filter:brightness(1.25)}}
.wl .blink{animation:wlblink 1s ease-in-out infinite}
.wl .pinblink{animation:wlglow 1.1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.wl .blink,.wl .pinblink,.wl .ping{animation:none}.wl .legline,.wl .memove{animation:none!important}}
@keyframes wlbar{0%{width:6%}100%{width:100%}}
@keyframes wldash{to{stroke-dashoffset:-40}}
@keyframes wlpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes wlping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@keyframes wlblink{0%,100%{opacity:.25}50%{opacity:1}}
.wl .loadbar{height:100%;background:#359FA0;border-radius:999px;animation:wlbar 1.6s ease-out forwards}
.wl .routeline{animation:wldash 1.2s linear infinite}
.wl .bob{animation:wlpulse 1.6s ease-in-out infinite}
.wl .ping{animation:wlping 1.6s ease-out infinite}
.wl .d1{animation:wlblink 1s infinite}.wl .d2{animation:wlblink 1s .2s infinite}.wl .d3{animation:wlblink 1s .4s infinite}




.wd button,.wd input,.wd select,.wd textarea{font-family:inherit;color:#2D2442}
.wd button{cursor:pointer}
.wd .btn{height:54px;padding:0 24px;border-radius:14px;border:2px solid #2D2442;background:#8AD6D1;font-size:16px;font-weight:700;box-shadow:0 4px 0 #2D2442;transition:transform .08s,box-shadow .08s}
.wd .btn:hover{background:#9FE0DB}
.wd .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2D2442}
.wd .btn.ghost{background:#FFFFFF}.wd .btn.ghost:hover{background:#FFF7DE}
.wd .btn.orange{background:#FF8C52}.wd .btn.orange:hover{background:#FF9D6B}
.wd .field{width:100%;box-sizing:border-box;height:52px;border-radius:12px;border:2px solid #2D2442;background:#FFFFFF;padding:0 16px;font-size:16px}
.wd .field:focus{outline:3px solid #8AD6D1;outline-offset:1px}
.wd .lbl{font-size:14px;font-weight:700;margin-bottom:8px;display:block}
.wd .chip{height:42px;padding:0 16px;border-radius:999px;border:2px solid #2D2442;background:#FFFFFF;font-size:14px;font-weight:700}
.wd .chip:hover{background:#FFF7DE}
.wd .card{background:#FFFFFF;border:2px solid #2D2442;border-radius:14px}
.wd .step{width:38px;height:38px;border-radius:10px;border:2px solid #2D2442;background:#FFFFFF;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.wd .mini{width:40px;height:40px;border-radius:10px;border:none;background:#FFF7DE;display:flex;align-items:center;justify-content:center;padding:0}
.wd .tab{height:44px;padding:0 18px;border-radius:10px;border:2px solid transparent;background:transparent;font-size:16px;font-weight:700}
.wd .tab:hover{border-color:#2D2442}
.wd .stay-range{-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;background:linear-gradient(90deg,#8AD6D1,#359FA0);border:2px solid #2D2442;outline:none;margin:10px 0}
.wd .stay-range::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#FF8C52;border:2.5px solid #2D2442;cursor:pointer}
.wd .stay-range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#FF8C52;border:2.5px solid #2D2442;cursor:pointer}
.wd .stay-range:focus-visible{box-shadow:0 0 0 3px #8AD6D1}
.wd .ph-add:focus-within{outline:3px solid #359FA0;outline-offset:2px}
.wd .ph-add:hover{background:#FFF7DE}
.wd .scroll>*{flex-shrink:0}
.wd .scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2D2442 transparent}
.wd .cand:hover .candlbl{background:#8AD6D1}
@keyframes wddrawA{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes wddrawB{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes wdmoveA{from{transform:translate(var(--dx),var(--dy))}to{transform:translate(0,0)}}
@keyframes wdmoveB{from{transform:translate(var(--dx),var(--dy))}to{transform:translate(0,0)}}
@keyframes wdblink{0%,100%{opacity:1;filter:brightness(1)}50%{opacity:.35;filter:brightness(1.35)}}
@keyframes wdglow{0%,100%{box-shadow:0 0 0 3px #FFFFFF,0 0 0 6px #FF8C52;filter:brightness(1)}50%{box-shadow:0 0 0 6px #FFFFFF,0 0 0 14px rgba(255,140,82,.25);filter:brightness(1.25)}}
.wd .blink{animation:wdblink 1s ease-in-out infinite}
.wd .pinblink{animation:wdglow 1.1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.wd .blink,.wd .pinblink,.wd .ping{animation:none}.wd .legline,.wd .memove{animation:none!important}}
@keyframes wdbar{0%{width:5%}100%{width:100%}}
@keyframes wddash{to{stroke-dashoffset:-60}}
@keyframes wdpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes wdping{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@keyframes wdblink{0%,100%{opacity:.25}50%{opacity:1}}
.wd .loadbar{height:100%;background:#359FA0;border-radius:999px;animation:wdbar 1.6s ease-out forwards}
.wd .routeline{animation:wddash 1.4s linear infinite}
.wd .bob{animation:wdpulse 1.6s ease-in-out infinite}
.wd .ping{animation:wdping 1.6s ease-out infinite}
.wd .d1{animation:wdblink 1s infinite}.wd .d2{animation:wdblink 1s .2s infinite}.wd .d3{animation:wdblink 1s .4s infinite}

</style>
</head>
<body>

<div id="landing">
  <header class="lp-top">
    <div class="lp-brand"><svg width="34" height="34" viewBox="0 0 92 92" aria-hidden="true"><path d="M18 70 C30 40 50 64 62 34" fill="none" stroke="#2D2442" stroke-width="6" stroke-dasharray="9 7" stroke-linecap="round"></path><circle cx="18" cy="70" r="9" fill="#8AD6D1" stroke="#2D2442" stroke-width="5"></circle><path d="M62 6 C76 6 84 16 84 27 C84 42 62 58 62 58 C62 58 40 42 40 27 C40 16 48 6 62 6 Z" fill="#FF8C52" stroke="#2D2442" stroke-width="5"></path></svg>Waylog</div>
  </header>
  <main class="lp-main">
    <section class="lp-hero">
      <h1>보고 싶은 버전을 선택하세요</h1>
    </section>
    <nav class="lp-choose" aria-label="프로토타입 버전 선택">
      <a class="lp-card mobile" href="#mobile">
        <span class="lp-rec" data-rec="mobile" hidden>이 기기에 추천</span>
        <div class="lp-art mobile" aria-hidden="true">
          <div class="dev-phone"><div class="dev-bar s"></div><div class="dev-map"><svg viewBox="0 0 120 90"><path d="M14 66 C30 30 52 70 70 40 S96 20 106 30" fill="none" stroke="#FF8C52" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round"/><circle cx="14" cy="66" r="6" fill="#2D2442"/><circle cx="52" cy="54" r="5.5" fill="#8AD6D1" stroke="#2D2442" stroke-width="2.5"/><circle cx="80" cy="34" r="5.5" fill="#8AD6D1" stroke="#2D2442" stroke-width="2.5"/><circle cx="106" cy="30" r="6" fill="#2D2442"/></svg></div><div class="dev-bar"></div></div>
        </div>
        <div class="lp-row">
          <div><div class="lp-name">모바일 버전</div></div>
          <span class="lp-go" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D2442" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </div>
      </a>
      <a class="lp-card pc" href="#pc">
        <span class="lp-rec" data-rec="pc" hidden>이 기기에 추천</span>
        <div class="lp-art" aria-hidden="true">
          <div class="dev-pc"><div class="dev-side"><div class="dev-bar"></div><div class="dev-bar s"></div><div class="dev-bar s"></div><div class="dev-bar s"></div></div><div class="dev-map"><svg viewBox="0 0 120 90"><path d="M14 66 C30 30 52 70 70 40 S96 20 106 30" fill="none" stroke="#FF8C52" stroke-width="4" stroke-dasharray="7 6" stroke-linecap="round"/><circle cx="14" cy="66" r="6" fill="#2D2442"/><circle cx="52" cy="54" r="5.5" fill="#8AD6D1" stroke="#2D2442" stroke-width="2.5"/><circle cx="80" cy="34" r="5.5" fill="#8AD6D1" stroke="#2D2442" stroke-width="2.5"/><circle cx="106" cy="30" r="6" fill="#2D2442"/></svg></div></div>
        </div>
        <div class="lp-row">
          <div><div class="lp-name">PC 버전</div></div>
          <span class="lp-go" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2D2442" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </div>
      </a>
    </nav>
  </main>
  </div>

<div id="viewer" hidden>
  <div class="vw-bar">
    <a class="vw-back" href="#" aria-label="버전 선택 화면으로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>처음으로</a>
    <span class="vw-title">Waylog 프로토타입</span>
    <nav class="vw-seg" aria-label="버전 전환"><a href="#mobile" data-v="mobile">모바일</a><a href="#pc" data-v="pc">PC</a></nav>
  </div>
  <div class="vw-stagewrap"><div id="stage"><div id="app"></div></div></div>
</div>

<template id="tpl-mobile">
<div class="wl" style="width: 390px; height: 844px; position: relative; overflow: clip; background: #FFF0C5; color: #2D2442; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif">

<!-- ================= 지도 레이어 ================= -->
<sc-if value="{{showMap}}" hint-placeholder-val="{{ false }}">
<div ref="{{mapRef}}" style="{{mapLayerStyle}}">
<div data-pan="" style="position: absolute; inset: 0">
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0; display: block"><path d="{{landOther}}" fill="#F3ECD8" stroke="#D2C6A2" stroke-width="1"></path><path d="{{landKR}}" fill="#FFF7DE" stroke="#2D2442" stroke-opacity="0.45" stroke-width="2" stroke-linejoin="round"></path></svg>
<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0; display: block; pointer-events: none"><path d="{{cmWave}}" fill="none" stroke="#7FCFCB" stroke-width="2" stroke-linecap="round" opacity="0.9"></path><path d="{{cmPark}}" fill="#D7EDB8" stroke="#9CC77A" stroke-width="1.5"></path><path d="{{cmRiver}}" fill="none" stroke="#A9DCEA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{cmRoad}}" fill="none" stroke="#E9DDB4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{cmRoad}}" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><path d="{{cmBridge}}" fill="none" stroke="#2D2442" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"></path><path d="{{cmBridge}}" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round"></path><path d="{{cmMount}}" fill="#BFE3A6" stroke="#2D2442" stroke-opacity="0.55" stroke-width="1.5" stroke-linejoin="round"></path></svg><sc-for list="{{cmAreas}}" as="ar" hint-placeholder-count="0"><span aria-hidden="true" style="{{ar.style}}">{{ar.name}}</span></sc-for>

="{{t.on}}" aria-disabled="{{t.off}}" style="{{t.style}}">{{t.label}}</button></sc-for></div></div></div>
<span style="font-size: 12px; color: #4F4766">{{tpNote}}</span>

</sc-if>

<!-- 타임라인 -->
<sc-if value="{{isTimeline}}" hint-placeholder-val="{{ true }}">
<button onClick="{{go.ai}}" style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border: 2px solid #FF8C52; border-radius: 12px; padding: 8px 10px; text-align: left">
<span style="flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px; background: #FF8C52; border: 2px solid #2D2442; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">AI</span>
<span style="font-size: 13px; line-height: 1.4; font-weight: 500">{{aiShort}}</span>
</button>
<div class="card" style="padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap"><span style="font-size: 14px; font-weight: 700">{{daySpan}}</span><span style="font-size: 12px; color: #4F4766">이동 {{totalMove}} · 경유 {{totalStay}}</span></div>
<sc-if value="{{hasArrivalNote}}" hint-placeholder-val="{{ false }}"><span style="{{arrivalNoteStyle}}">{{arrivalNote}}</span></sc-if>
<div style="display: flex; height: 12px; border-radius: 4px; overflow: hidden; border: 2px solid #2D2442" aria-hidden="true"><sc-for list="{{timeBar}}" as="b" hint-placeholder-count="5"><span style="{{b.style}}"></span></sc-for></div>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{tl}}" as="r" hint-placeholder-count="4">
<sc-if value="{{r.move}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 8px; min-height: 42px; padding-left: 62px"><span style="width: 3px; align-self: stretch; background: #FF8C52; margin-left: 12px; flex-shrink: 0"></span><div role="group" aria-label="{{r.legAria}}" style="display: flex; border: 2px solid #2D2442; border-radius: 9px; overflow: hidden; background: #FFFFFF; flex-shrink: 0"><sc-for list="{{r.legModes}}" as="lm" hint-placeholder-count="3"><button onClick="{{lm.pick}}" aria-pressed="{{lm.on}}" style="{{lm.style}}">{{lm.label}}</button></sc-for></div><span style="font-size: 12px; font-weight: 700; color: #4F4766; white-space: nowrap">{{r.moveLabel}}</span></div></sc-if>
<div style="display: flex; gap: 8px">
<span style="width: 54px; flex-shrink: 0; font-size: 11px; font-weight: 700; padding-top: 10px; text-align: right">{{r.clock}}</span>
<div style="{{r.block}}">
<div style="display: flex; align-items: center; gap: 8px">
<span style="{{r.badge}}">{{r.label}}</span>
<div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1"><span style="font-size: 14px; font-weight: 700">{{r.name}}</span><span style="font-size: 11px; color: #4F4766">{{r.range}}</span></div>
<sc-if value="{{r.mid}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: 2px"><button class="mini" aria-label="위로" onClick="{{r.up}}" disabled="{{r.noUp}}" style="{{r.upOp}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2D2442" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button><button class="mini" aria-label="아래로" onClick="{{r.down}}" disabled="{{r.noDown}}" style="{{r.downOp}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2D2442" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button><button class="mini" aria-label="{{r.removeAria}}" onClick="{{r.remove}}" style="font-size: 17px; font-weight: 700; color: #A3341A">×</button></div></sc-if>
</div>
<sc-if value="{{r.isStart}}" hint-placeholder-val="{{ false }}"><button id="m-tl-start" type="button" onClick="{{openStartTime}}" aria-haspopup="dialog" aria-expanded="{{startTpOpen}}" aria-label="출발 시간 바꾸기 · {{startTimeLabel}}" style="{{tlStartTrig}}"><span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 11px; font-weight: 700; color: #287F80">출발 시간</span><span>{{startTimeLabel}}</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 9l6 6 6-6"></path></svg></button></sc-if>
<sc-if value="{{r.isEnd}}" hint-placeholder-val="{{ false }}"><button id="m-tl-end" type="button" onClick="{{openEndTime}}" aria-haspopup="dialog" aria-expanded="{{endTpOpen}}" aria-label="도착 시간 바꾸기 · {{endTimeLabel}}" style="{{tlEndTrig}}"><span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 11px; font-weight: 700; color: #C2551E">도착 시간</span><span>{{endTimeLabel}}</span></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 9l6 6 6-6"></path></svg></button></sc-if><sc-if value="{{r.tpHere}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="{{tpTitle}} 선택" style="border: 2px solid #2D2442; border-radius: 14px; background: #FFFFFF; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 3px 0 #2D2442">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 14px; font-weight: 700">{{tpTitle}}</span><span style="font-size: 13px; font-weight: 700; color: #287F80">{{tpValue}}</span><button onClick="{{tpClose}}" style="margin-left: auto; height: 32px; padding: 0 12px; border-radius: 9px; border: 2px solid #2D2442; background: #FFF0C5; font-size: 12px; font-weight: 700">닫기</button></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: start"><div role="group" aria-label="오전/오후" style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="{{tpHead1}}"><span style="width: 16px; height: 16px; border-radius: 50%; background: #2D2442; color: #FFF0C5; font-size: 10px; display: inline-flex; align-items: center; justify-content: center">1</span>오전/오후</span><div style="display: flex; flex-direction: column; gap: 5px;"><sc-for list="{{tpAmpmList}}" as="t" hint-placeholder-count="2"><button onClick="{{t.pick}}" aria-label="{{t.aria}}" aria-pressed="{{t.on}}" aria-disabled="{{t.off}}" style="{{t.style}}">{{t.label}}</button></sc-for></div></div><div role="group" aria-label="시" style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="{{tpHead2}}"><span style="width: 16px; height: 16px; border-radius: 50%; background: #2D2442; color: #FFF0C5; font-size: 10px; display: inline-flex; align-items: center; justify-content: center">2</span>시</span><div class="scroll" style="display: flex; flex-direction: column; gap: 5px; max-height: 172px; overflow-y: auto; padding: 2px;"><sc-for list="{{tpHourList}}" as="t" hint-placeholder-count="12"><button onClick="{{t.pick}}" aria-label="{{t.aria}}" aria-pressed="{{t.on}}" aria-disabled="{{t.off}}" style="{{t.style}}">{{t.label}}</button></sc-for></div></div><div role="group" aria-label="분" style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="{{tpHead3}}"><span style="width: 16px; height: 16px; border-radius: 50%; background: #2D2442; color: #FFF0C5; font-size: 10px; display: inline-flex; align-items: center; justify-content: center">3</span>분</span><div class="scroll" style="display: flex; flex-direction: column; gap: 5px; max-height: 172px; overflow-y: auto; padding: 2px;"><sc-for list="{{tpMinList}}" as="t" hint-placeholder-count="12"><button onClick="{{t.pick}}" aria-label="{{t.aria}}" aria-pressed="{{t.on}}" aria-disabled="{{t.off}}" style="{{t.style}}">{{t.label}}</button></sc-for></div></div></div>
<span style="font-size: 12px; color: #4F4766">{{tpNote}}</span>
</div>
</sc-if>
<sc-if value="{{r.mid}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700; color: #287F80">경유 시간 · {{r.stayLabel}}</span>
<div style="display: flex; align-items: center; gap: 8px">
<label for="{{r.rangeId}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{r.rangeAria}} 슬라이더</label>
<input id="{{r.rangeId}}" class="stay-range" type="range" min="10" max="240" step="5" value="{{r.stayVal}}" onChange="{{r.onRange}}" style="flex: 1; min-width: 0">
<label for="{{r.numId}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{r.rangeAria}} 분 단위 입력</label>
<input id="{{r.numId}}" type="number" inputmode="numeric" min="10" max="600" step="5" value="{{r.draft}}" onChange="{{r.onNum}}" style="width: 58px; height: 36px; box-sizing: border-box; border: 2px solid #2D2442; border-radius: 9px; background: #FFFFFF; text-align: center; font-size: 13px; font-weight: 700; padding: 0 4px">
<span style="font-size: 12px; font-weight: 700">분</span>
</div>
</div>
</sc-if>
</div>
</div>
</sc-for>
<sc-if value="{{tlAddOff}}" hint-placeholder-val="{{ true }}"><button onClick="{{tlAddOpen}}" style="width: 100%; min-height: 44px; border-radius: 12px; border: 2px dashed #2D2442; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700"><span style="width: 24px; height: 24px; border-radius: 50%; background: #8AD6D1; border: 2px solid #2D2442; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; line-height: 1">+</span>경유지 추가 · 검색해서 넣기</button></sc-if>
<sc-if value="{{tlAddOn}}" hint-placeholder-val="{{ false }}"><div class="card" style="padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; border-color: #359FA0; box-shadow: 0 0 0 3px #8AD6D1">
<div style="display: flex; align-items: center; gap: 8px"><label for="m-tl-add" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">추가할 경유지 검색</label><input id="m-tl-add" class="field" type="text" value="{{tlAddText}}" onChange="{{tlAddInput}}" placeholder="추가할 경유지 검색 · 예) 광안리" autocomplete="off" style="height: 44px; flex: 1; min-width: 0"><button onClick="{{tlAddClose}}" aria-label="경유지 추가 닫기" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; border: 2px solid #2D2442; background: #FFF0C5; font-size: 18px; font-weight: 700">×</button></div>
<span style="font-size: 12px; font-weight: 700; color: #4F4766">{{tlAddHint}}</span>
<div style="display: flex; flex-direction: column; gap: 4px"><sc-for list="{{tlAddResults}}" as="ar" hint-placeholder-count="3"><button onClick="{{ar.pick}}" style="{{ar.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D2442" stroke-width="2.2" aria-hidden="true" style="flex-shrink: 0"><path d="M12 2c4 0 7 3 7 7 0 5-7 13-7 13S5 14 5 9c0-4 3-7 7-7z"></path><circle cx="12" cy="9" r="2.5"></circle></svg><span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 700">{{ar.name}}</span><span style="font-size: 12px; color: #4F4766">{{ar.sub}}</span></span></button></sc-for></div>
</div></sc-if>
</div>
<button onClick="{{optimize}}" style="height: 44px; border-radius: 12px; border: 2px solid #2D2442; background: #8AD6D1; font-size: 14px; font-weight: 700">순서 최적화 · 이동이 가장 짧게</button>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
<span style="font-size: 13px; font-weight: 700">장소 더하기 <span style="font-weight: 500; color: #4F4766">· 넣으면 늘어나는 시간 · 지도의 + 장소를 눌러도 돼요</span></span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{suggest}}" as="g" hint-placeholder-count="3"><button onClick="{{g.add}}" style="height: 38px; padding: 0 12px; border-radius: 999px; border: 2px dashed #2D2442; background: #FFFFFF; font-size: 13px; font-weight: 700">+ {{g.name}} <span style="font-weight: 500; color: #4F4766">{{g.cost}}</span></button></sc-for>
</div>
</div>
</sc-if>
</div>

<div style="padding: 10px 16px 12px; border-top: 2px solid #2D2442; display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; flex-shrink: 0; background: #FFF0C5">
<button class="btn ghost" onClick="{{saveRoute}}" style="height: 48px">{{saveLabel}}</button>
<button class="btn orange" onClick="{{startNav}}" style="height: 48px">출발하기</button>
</div>
</div>
</sc-if>

<!-- ---------- AI 탭 (시안 B) ---------- -->
<sc-if value="{{tab.ai}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 146px; left: 0; right: 0; bottom: 72px; display: flex; flex-direction: column; background: #FFF0C5">
<div style="padding: 0 12px 8px; flex-shrink: 0; display: flex; align-items: center; gap: 8px">
<button onClick="{{backToTimeline}}" aria-label="경로 타임라인으로 돌아가기" style="height: 44px; padding: 0 14px 0 8px; border-radius: 12px; border: 2px solid #2D2442; background: #FFFFFF; box-shadow: 0 3px 0 #2D2442; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D2442" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>경로 타임라인으로</button>
<span style="margin-left: auto; font-size: 13px; font-weight: 700; color: #287F80">AI 동선 계획</span>
</div>
<div style="padding: 0 12px 8px; flex-shrink: 0">
<button onClick="{{toggleAnalysis}}" aria-expanded="{{showAnalysis}}" class="card" style="width: 100%; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; text-align: left">
<span style="display: flex; align-items: center; gap: 8px; width: 100%"><span style="font-size: 14px; font-weight: 700">{{dayLabel}} 동선 분석</span><span style="font-size: 12px; font-weight: 700; color: #287F80">{{aiTitle}}</span><span style="margin-left: auto; font-size: 16px; font-weight: 700">{{analysisCaret}}</span></span>
<span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; width: 100%">
<sc-for list="{{aiStats}}" as="a" hint-placeholder-count="3"><span style="background: #FFF7DE; border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column"><span style="font-size: 11px; color: #4F4766">{{a.label}}</span><span style="font-size: 17px; font-weight: 700">{{a.value}}</span></span></sc-for>
</span>
<sc-if value="{{showAnalysis}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; flex-direction: column; gap: 6px; width: 100%">
<span style="display: flex; height: 14px; border-radius: 4px; overflow: hidden; border: 2px solid #2D2442"><span style="{{barMove}}"></span><span style="{{barStay}}"></span></span>
<sc-for list="{{aiTips}}" as="t" hint-placeholder-count="3"><span style="display: flex; gap: 8px; font-size: 13px; line-height: 1.45"><span style="{{t.dot}}">{{t.tag}}</span>{{t.text}}</span></sc-for>
</span>
</sc-if>
</button>
</div>
<div class="scroll" ref="{{setList}}" style="flex-grow: 1; min-height: 0; padding: 4px 12px 8px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="2">
<sc-if value="{{m.isMe}}" hint-placeholder-val="{{ false }}"><div style="align-self: flex-end; max-width: 78%; background: #8AD6D1; border: 2px solid #2D2442; border-radius: 16px 16px 4px 16px; padding: 9px 12px; font-size: 14px; font-weight: 500; line-height: 1.45">{{m.text}}</div></sc-if>
<sc-if value="{{m.isAi}}" hint-placeholder-val="{{ true }}"><div style="align-self: flex-start; max-width: 86%; background: #FFFFFF; border: 2px solid #2D2442; border-radius: 16px 16px 16px 4px; padding: 9px 12px; font-size: 14px; line-height: 1.5">{{m.text}}</div></sc-if>
<sc-if value="{{m.isRoute}}" hint-placeholder-val="{{ false }}">
<div class="card" style="align-self: flex-start; width: 290px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 3px 0 #2D2442">
<div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 11px; font-weight: 700; background: #2D2442; color: #FFF0C5; border-radius: 6px; padding: 2px 6px">{{m.badge}}</span><span style="font-size: 12px; font-weight: 700; color: #287F80">{{m.endClock}} 도착</span></div>
<sc-for list="{{m.rows}}" as="r" hint-placeholder-count="4"><div style="display: flex; align-items: center; gap: 8px; font-size: 13px"><span style="{{r.badge}}">{{r.label}}</span><span style="font-weight: 700">{{r.name}}</span><span style="margin-left: auto; color: #4F4766; font-size: 12px">{{r.time}}</span></div></sc-for>
<div style="font-size: 12px; color: #4F4766; border-top: 1.5px dashed #2D2442; padding-top: 6px">{{m.summary}}</div>
<button onClick="{{showOnMap}}" style="height: 38px; border-radius: 10px; border: 2px solid #2D2442; background: #8AD6D1; font-size: 13px; font-weight: 700">지도에서 보기</button>
</div>
</sc-if>
</sc-for>
<sc-if value="{{typing}}" hint-placeholder-val="{{ false }}"><div aria-label="AI가 입력 중" style="align-self: flex-start; background: #FFFFFF; border: 2px solid #2D2442; border-radius: 16px 16px 16px 4px; padding: 11px 14px; display: flex; gap: 5px"><span class="d1" style="width: 7px; height: 7px; border-radius: 50%; background: #2D2442"></span><span class="d2" style="width: 7px; height: 7px; border-radius: 50%; background: #2D2442"></span><span class="d3" style="width: 7px; height: 7px; border-radius: 50%; background: #2D2442"></span></div></sc-if>
</div>
<div style="flex-shrink: 0; border-top: 2px solid #2D2442; background: #FFFFFF; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{chips}}" as="c" hint-placeholder-count="3"><button onClick="{{c.pick}}" disabled="{{typing}}" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid #2D2442; background: #FFF0C5; font-size: 13px; font-weight: 700">{{c.label}}</button></sc-for></div>
<div style="display: flex; gap: 8px">
<label for="m-chat" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">AI에게 메시지</label>
<input id="m-chat" type="text" value="{{draft}}" onChange="{{onDraft}}" placeholder="예) 오후엔 좀 쉬고 싶어" style="flex-grow: 1; height: 44px; border-radius: 12px; border: 2px solid #2D2442; padding: 0 12px; font-size: 14px; background: #FFF7DE">
<button onClick="{{sendDraft}}" aria-label="보내기" class="icon" style="background: #8AD6D1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2D2442" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>
</sc-if>

<!-- ---------- 보관 탭 : 저장한 경로 ---------- -->
<sc-if value="{{tab.archive}}" hint-placeholder-val="{{ false }}">
<div class="scroll" style="position: absolute; top: 146px; left: 0; right: 0; bottom: 72px; padding: 0 14px 16px; display: flex; flex-direction: column; gap: 10px; background: #FFF0C5">
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 700">{{archiveTitle}}</span><span style="font-size: 13px; color: #4F4766">{{archiveDesc}}</span></div>
<div role="group" aria-label="보관함 구분" style="display: grid; grid-template-columns: 1fr 1fr; border: 2px solid #2D2442; border-radius: 12px; overflow: hidden; background: #FFFFFF; flex-shrink: 0"><sc-for list="{{archTabs}}" as="t" hint-placeholder-count="2"><button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">{{t.label}}</button></sc-for></div>
<sc-if value="{{archSaved}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{curUnsaved}}" hint-placeholder-val="{{ false }}"><div class="card" style="padding: 12px 14px; display: flex; align-items: center; gap: 12px; border-style: dashed"><div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0"><span style="font-size: 12px; color: #4F4766">지금 짜고 있는 경로</span><span style="font-size: 16px; font-weight: 700">{{tripName}}</span></div><button class="btn" onClick="{{archiveSave}}" style="width: auto; height: 40px; padding: 0 16px; font-size: 13px; flex-shrink: 0">보관하기</button></div></sc-if>
<sc-if value="{{noSaved}}" hint-placeholder-val="{{ false }}"><div style="padding: 24px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#2D2442" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.5"></rect><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"></path></svg><span style="font-size: 16px; font-weight: 700">보관한 경로가 없어요</span><span style="font-size: 13px; color: #4F4766; line-height: 1.5">경로를 짠 뒤 [저장]을 누르면 여기에 모여요.</span></div></sc-if>
<sc-for list="{{savedCards}}" as="a" hint-placeholder-count="2">
<div class="card" style="{{a.cardStyle}}">
<div style="display: flex; align-items: flex-start; gap: 10px"><div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0"><span style="font-size: 12px; font-weight: 700; color: #287F80">{{a.date}}</span><span style="font-size: 16px; font-weight: 700">{{a.name}}</span><span style="font-size: 13px; color: #4F4766">{{a.ends}}</span></div><sc-if value="{{a.isCur}}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; border: 2px solid #2D2442; background: #8AD6D1">{{a.curLabel}}</span></sc-if></div>
<div style="background: #FFF7DE; border-radius: 10px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 700">{{a.stops}}</span><span style="color: #4F4766">{{a.preview}}</span></div>

<div style="display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 700; color: #287F80">{{tripName}} · 2 / 2</span><span style="font-size: 24px; font-weight: 700">출발지와 도착지를 정해주세요</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 8px"><div style="{{fStartWrap}}"><span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #2D2442; color: #FFF0C5; box-sizing: border-box; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">S</span><label for="d-start" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">출발지</label><input id="d-start" type="text" value="{{startText}}" onChange="{{onStartText}}" onClick="{{fieldStart}}" placeholder="출발지 입력 · 예) 부산역, 서면" autocomplete="off" style="flex: 1; min-width: 0; height: 100%; min-height: 40px; border: none; outline: none; background: transparent; font-size: 16px; font-weight: 700; color: #2D2442; padding: 0"><sc-if value="{{hasStartText}}" hint-placeholder-val="{{ false }}"><button onClick="{{clearStart}}" aria-label="출발지 지우기" style="width: 36px; height: 36px; flex-shrink: 0; border: none; border-radius: 50%; background: transparent; font-size: 18px; font-weight: 700; color: #4F4766">×</button></sc-if></div><button onClick="{{swapEnds}}" aria-label="출발지와 도착지 바꾸기" style="width: 48px; flex-shrink: 0; border-radius: 12px; border: 2px solid #2D2442; background: #FFF0C5; font-size: 18px; font-weight: 700">⇅</button></div>
<sc-for list="{{viaRows}}" as="v" hint-placeholder-count="1"><div style="display: flex; gap: 8px"><div style="{{v.wrap}}"><span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #359FA0; border: 2px solid #2D2442; color: #FFFFFF; box-sizing: border-box; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{v.n}}</span><label for="{{v.id}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{v.aria}}</label><input id="{{v.id}}" type="text" value="{{v.text}}" onChange="{{v.onText}}" onClick="{{v.focus}}" placeholder="경유지 검색 · 예) 자갈치시장 (비워 둬도 돼요)" autocomplete="off" style="flex: 1; min-width: 0; height: 100%; min-height: 40px; border: none; outline: none; background: transparent; font-size: 16px; font-weight: 700; color: #2D2442; padding: 0"><button onClick="{{v.remove}}" aria-label="{{v.removeAria}}" style="width: 36px; height: 36px; flex-shrink: 0; border: none; border-radius: 50%; background: transparent; font-size: 18px; font-weight: 700; color: #4F4766">×</button></div><sc-if value="{{v.last}}" hint-placeholder-val="{{ true }}"><button onClick="{{addVia}}" aria-label="경유지 추가" style="width: 48px; flex-shrink: 0; border-radius: 12px; border: 2px solid #2D2442; background: #8AD6D1; box-shadow: 0 3px 0 #2D2442; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0; font-weight: 700"><span style="font-size: 20px; line-height: 1">+</span><span style="font-size: 10px; line-height: 1.2">추가</span></button></sc-if><sc-if value="{{v.notLast}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 48px; flex-shrink: 0"></span></sc-if></div></sc-for>
<div style="display: flex; gap: 8px"><div style="{{fEndWrap}}"><span style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #FF8C52; border: 2px solid #2D2442; color: #2D2442; box-sizing: border-box; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">E</span><label for="d-end" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">도착지</label><input id="d-end" type="text" value="{{endText}}" onChange="{{onEndText}}" onClick="{{fieldEnd}}" placeholder="도착지 입력 · 예) 해운대, 남포동" autocomplete="off" style="flex: 1; min-width: 0; height: 100%; min-height: 40px; border: none; outline: none; background: transparent; font-size: 16px; font-weight: 700; color: #2D2442; padding: 0"><sc-if value="{{hasEndText}}" hint-placeholder-val="{{ false }}"><button onClick="{{clearEnd}}" aria-label="도착지 지우기" style="width: 36px; height: 36px; flex-shrink: 0; border: none; border-radius: 50%; background: transparent; font-size: 18px; font-weight: 700; color: #4F4766">×</button></sc-if></div><span aria-hidden="true" style="width: 48px; flex-shrink: 0"></span></div>
</div>
<div style="display: flex; gap: 8px"><div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><label for="d-starttime" style="font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span style="width: 20px; height: 20px; border-radius: 50%; background: #2D2442; color: #FFF0C5; box-sizing: border-box; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">S</span>출발 시간</label><button id="d-starttime" type="button" onClick="{{openStartTime}}" aria-haspopup="dialog" aria-expanded="{{startTpOpen}}" style="{{startTrig}}"><span>{{startTimeLabel}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 9l6 6 6-6"></path></svg></button></div><div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><label for="d-endtime" style="font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px"><span style="width: 20px; height: 20px; border-radius: 50%; background: #FF8C52; border: 2px solid #2D2442; box-sizing: border-box; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">E</span>도착 시간</label><button id="d-endtime" type="button" onClick="{{openEndTime}}" aria-haspopup="dialog" aria-expanded="{{endTpOpen}}" style="{{endTrig}}"><span>{{endTimeLabel}}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M6 9l6 6 6-6"></path></svg></button></div></div>
<sc-if value="{{tpOpen}}" hint-placeholder-val="{{ false }}">

<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 15px; font-weight: 700">{{tpTitle}}</span><span style="font-size: 14px; font-weight: 700; color: #287F80">{{tpValue}}</span><button onClick="{{tpClose}}" style="margin-left: auto; height: 32px; padding: 0 12px; border-radius: 9px; border: 2px solid #2D2442; background: #FFF0C5; font-size: 13px; font-weight: 700">닫기</button></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: start"><div role="group" aria-label="오전/오후" style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="{{tpHead1}}"><span style="width: 16px; height: 16px; border-radius: 50%; background: #2D2442; color: #FFF0C5; font-size: 10px; display: inline-flex; align-items: center; justify-content: center">1</span>오전/오후</span><div style="display: flex; flex-direction: column; gap: 5px;"><sc-for list="{{tpAmpmList}}" as="t" hint-placeholder-count="2"><button onClick="{{t.pick}}" aria-label="{{t.aria}}" aria-pressed="{{t.on}}" aria-disabled="{{t.off}}" style="{{t.style}}">{{t.label}}</button></sc-for></div></div><div role="group" aria-label="시" style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="{{tpHead2}}"><span style="width: 16px; height: 16px; border-radius: 50%; background: #2D2442; color: #FFF0C5; font-size: 10px; display: inline-flex; align-items: center; justify-content: center">2</span>시</span><div class="scroll" style="display: flex; flex-direction: column; gap: 5px; max-height: 196px; overflow-y: auto; padding: 2px;"><sc-for list="{{tpHourList}}" as="t" hint-placeholder-count="12"><button onClick="{{t.pick}}" aria-label="{{t.aria}}" aria-pressed="{{t.on}}" aria-disabled="{{t.off}}" style="{{t.style}}">{{t.label}}</button></sc-for></div></div><div role="group" aria-label="분" style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="{{tpHead3}}"><span style="width: 16px; height: 16px; border-radius: 50%; background: #2D2442; color: #FFF0C5; font-size: 10px; display: inline-flex; align-items: center; justify-content: center">3</span>분</span><div class="scroll" style="display: flex; flex-direction: column; gap: 5px; max-height: 196px; overflow-y: auto; padding: 2px;"><sc-for list="{{tpMinList}}" as="t" hint-placeholder-count="12"><button onClick="{{t.pick}}" aria-label="{{t.aria}}" aria-pressed="{{t.on}}" aria-disabled="{{t.off}}" style="{{t.style}}">{{t.label}}</button></sc-for></div></div></div>
<span style="font-size: 12px; color: #4F4766">{{tpNote}}</span>
</div>
</sc-if>
<span style="font-size: 15px; font-weight: 700">{{placesHint}}</span>
<div style="border-top: 2px solid #2D2442; margin: 2px -24px 0; padding: 12px 24px 0; flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px">

</div>

</div>

<div class="card" style="padding: 12px 14px"><span style="display: block; font-size: 13px; color: #4F4766">도착 예정</span><span style="font-size: 24px; font-weight: 700">{{arriveClock}}</span></div>
</div>
<div class="card" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 15px"><span style="display: flex; gap: 10px"><span style="font-weight: 700; color: #287F80">지금</span>{{guide1}}</span><span style="display: flex; gap: 10px"><span style="font-weight: 700; color: #4F4766">다음</span>{{guide2}}</span></div>

<script>
(function () {
  var CFG = {
    mobile: { W: 390, H: 844, MAX: 1.15, radius: '36px', cls: window.WaylogMobile, tpl: 'tpl-mobile' },
    pc: { W: 1920, H: 1080, MAX: 1, radius: '10px', cls: window.WaylogPC, tpl: 'tpl-pc' }
  };
  var landing = document.getElementById('landing'), viewer = document.getElementById('viewer');
  var stage = document.getElementById('stage'), app = document.getElementById('app'), wrap = stage.parentNode;
  var current = null;

  // 기기에 맞는 버전 추천
  var small = window.matchMedia('(max-width: 760px), (pointer: coarse) and (max-width: 1024px)');
  function recommend() {
    var rec = small.matches ? 'mobile' : 'pc';
    document.querySelectorAll('[data-rec]').forEach(function (el) { el.hidden = el.getAttribute('data-rec') !== rec; });
    document.body.classList.toggle('prefer-pc', rec === 'pc');
  }
  if (small.addEventListener) small.addEventListener('change', recommend); else small.addListener(recommend);
  recommend();

  function fit() {
    if (!current) return;
    var c = CFG[current];
    var s = Math.min(wrap.clientWidth / c.W, wrap.clientHeight / c.H, c.MAX);
    stage.style.width = (c.W * s) + 'px'; stage.style.height = (c.H * s) + 'px';
    app.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);

  function route() {
    var v = location.hash.replace('#', '');
    if (!CFG[v]) v = null;
    if (current && v !== current) { location.reload(); return; }   // 다른 버전으로 갈 땐 상태를 깨끗하게
    if (!v) { landing.hidden = false; viewer.hidden = true; document.title = 'Waylog'; return; }
    var c = CFG[v]; current = v;
    landing.hidden = true; viewer.hidden = false;
    document.title = 'Waylog · ' + (v === 'pc' ? 'PC' : '모바일') + ' 프로토타입';
    document.querySelectorAll('.vw-seg a').forEach(function (a) {
      if (a.getAttribute('data-v') === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    stage.style.borderRadius = c.radius;
    app.style.width = c.W + 'px'; app.style.height = c.H + 'px';
    fit();
    window.mountDC(c.cls, app, document.getElementById(c.tpl).content);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
